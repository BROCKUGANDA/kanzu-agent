# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — local reproducibility testing for Kanzu Agent
#
# Usage:
#   docker compose run --rm kanzu doctor         # health check (no model)
#   docker compose run --rm kanzu init           # seed ledger
#   docker compose run --rm kanzu scan           # deterministic rules only
#   docker compose run --rm -e KANZU_LANG=sw kanzu ask "chunguza miamala"
#
# Pre-requisites:
#   1. docker compose build
#   2. bash download_model.sh          (puts GGUF into ./model/)
# ─────────────────────────────────────────────────────────────────────────────

services:
  kanzu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LLAMA_TAG: "b10580"
    image: kanzu-agent:local
    volumes:
      # Model weights — read-only so the container cannot modify them.
      - ./model:/app/model:ro
      # Persistent ledger — named volume so data survives container restart.
      - kanzu-data:/app/var
    environment:
      KANZU_ROOT: /app
      # Override at runtime: docker compose run -e KANZU_LANG=sw kanzu ask "..."
      KANZU_LANG: en
      KANZU_THREADS: "4"
      KANZU_SEED: "42"
      KANZU_DUTY_CYCLE: "0.7"
    # ── production hardening ──
    # Refuse privilege escalation from within the container.
    security_opt:
      - no-new-privileges:true
    # The agent needs no Linux capabilities at all — drop them all.
    cap_drop:
      - ALL
    # Read-only root filesystem except the two writable volumes below.
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      # kanzu writes nothing outside var/ at runtime; give sqlite its temp dir.
      - /app/var/tmp:size=32m,noexec,nosuid
    # Keep inference from starving the host on shared dev machines. Tune to
    # the ADTC Standard Laptop profile when scoring.
    deploy:
      resources:
        limits:
          cpus: "4"
          pids: 128
    # The default CMD is "doctor" (set in Dockerfile); override per run.
    stdin_open: true
    tty: true

volumes:
  kanzu-data:
    driver: local
