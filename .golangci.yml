# Minimal, valid golangci-lint v2 configuration.
# Kept deliberately small so it parses on any recent v2 release; the CI action
# pins the exact version (see .github/workflows/ci.yml).
version: "2"

run:
  timeout: 5m
  # Match the Dockerfile builder (golang:1.25) and the local toolchain.
  go: "1.25"

linters:
  enable:
    - govet
    - staticcheck
    - gosimple
    - ineffassign
    - misspell
    - goconst
    - gocritic

issues:
  exclude-dirs:
    - vendor
