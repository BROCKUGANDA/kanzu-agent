name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Build & unit tests ──────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build binary
        run: |
          CGO_ENABLED=0 go build -mod=vendor -trimpath \
            -ldflags="-s -w" \
            -o bin/kanzu ./cmd/kanzu

      - name: go vet
        run: go vet -mod=vendor ./...

      - name: Run tests
        run: |
          go test -mod=vendor -race -count=1 -timeout 120s ./...

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanzu-linux-amd64
          path: bin/kanzu
          retention-days: 7

  # ── 2. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.4.0
          args: --timeout=5m --out-format=colored-line-number

  # ── 3. Metadata validation ─────────────────────────────────────────────────
  metadata:
    name: Validate metadata.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required fields
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("metadata.json") as f:
              m = json.load(f)
          errors = []
          for key in ["team_id", "domain", "language_scope",
                      "african_alpha_claim", "budget_laptop_claim",
                      "test_prompts", "model"]:
              if key not in m:
                  errors.append(f"missing top-level key: {key}")
          sub = m.get("submitter", {})
          for k in ["name", "email", "github_handle"]:
              if "SET_ME" in str(sub.get(k, "")):
                  errors.append(f"submitter.{k} still contains SET_ME")
          if len(m.get("test_prompts", [])) != 2:
              errors.append("need exactly 2 test_prompts")
          rt = m.get("_runtime", {})
          if not rt.get("model_path"):
              errors.append("_runtime.model_path is empty")
          if "kes" in json.dumps(m).lower():
              errors.append("Found KES — submission must use UGX (Uganda)")
          if "kenya" in json.dumps(m).lower():
              errors.append("Found Kenya — submission is for Uganda")
          if errors:
              print("ERRORS in metadata.json:")
              for e in errors: print(f"  ✗ {e}")
              sys.exit(1)
          langs = m.get("language_scope", [])
          print(f"✓ metadata.json valid  languages={langs}  team={m['team_id']}")
          EOF

      - name: Check submission.json in sync
        run: |
          python3 - <<'EOF'
          import json
          with open("metadata.json") as f: meta = json.load(f)
          with open("submission.json") as f: sub = json.load(f)
          s = sub.get("submission", {})
          errors = []
          if s.get("team_id") != meta.get("team_id"):
              errors.append(f"team_id mismatch: metadata={meta.get('team_id')} submission={s.get('team_id')}")
          if sorted(s.get("language_scope",[])) != sorted(meta.get("language_scope",[])):
              errors.append("language_scope out of sync")
          for tp_m, tp_s in zip(meta.get("test_prompts",[]), s.get("test_prompts",[])):
              if tp_m.get("prompt_id") != tp_s.get("prompt_id"):
                  errors.append(f"test prompt id mismatch")
              if tp_m.get("prompt") != tp_s.get("prompt"):
                  errors.append(f"test prompt text out of sync: {tp_m.get('prompt_id')}")
          if errors:
              import sys
              print("ERRORS — metadata.json and submission.json are out of sync:")
              for e in errors: print(f"  ✗ {e}")
              sys.exit(1)
          print("✓ submission.json in sync with metadata.json")
          EOF

  # ── 4. Offline claim check (no net/http in runtime paths) ──────────────────
  offline-check:
    name: Offline claim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify no net/http in runtime code
        run: |
          # Match real import declarations only — a mention of "net/http" in a
          # comment or doc string is not a network dependency. The grep is the
          # fast guard; `go list -deps` below is the authoritative check over
          # the actual build graph.
          if grep -rn --include='*.go' '"net/http"' cmd internal; then
            echo "FAIL: net/http imported in runtime code — breaks offline claim"
            exit 1
          fi
          deps=$(go list -deps ./... | grep -c '^net/http$' || true)
          if [ "$deps" != "0" ]; then
            echo "FAIL: net/http in the dependency graph"
            exit 1
          fi
          echo "✓ No net/http in cmd/ or internal/"

      - name: Verify no hardcoded KES / Kenya references
        run: |
          # var/prompts/ is included on purpose: the six versioned system
          # prompts ship in the image, and a stale "SACCO ya Kenya" in
          # prompt-planning-sw.txt once slipped past this check because the
          # directory was not scanned.
          if grep -rn '\bKES\b\|Kenya\|Kenyan\|Financial Reporting Centre\|SASRA' \
              cmd/ internal/ knowledge/ fixtures/ var/prompts/ \
              metadata.json submission.json \
              --include='*.go' --include='*.md' --include='*.json' \
              --include='*.csv' --include='*.txt'; then
            echo "FAIL: Found Kenya/KES references — submission is Uganda/UGX/FIA"
            exit 1
          fi
          echo "✓ No KES/Kenya references in source or prompt templates"

      - name: Verify the six versioned prompt templates are present and non-empty
        run: |
          missing=0
          for f in planning-en planning-sw planning-lg \
                   narration-en narration-sw narration-lg; do
            p="var/prompts/prompt-$f.txt"
            if [ ! -s "$p" ]; then
              echo "FAIL: $p is missing or empty"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "✓ All six prompt templates present and non-empty"

  # ── 5. Docker build (PR and branch pushes — no push to registry) ───────────
  docker-build:
    name: Docker build (verify)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: kanzu-agent:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
